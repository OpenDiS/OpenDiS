# OpenDiS CI, on the MC3 gpu-ampere runner (shell executor, tags MC3 + CPU).
#
# Build, then the unit tests, then the full runs. Separate stages rather than one
# test stage, so unit results land before the slower full runs start and a unit
# failure stops there. Either failing fails the pipeline.

stages: [build, unit, full_run]

variables:
  # exadis, ctypesgen and graph come from github; external/paradis carries
  # update = none in .gitmodules and is skipped, which is what we want here
  GIT_SUBMODULE_STRATEGY: recursive
  # The build job starts with rm -rf build, so every pipeline builds cold by
  # choice. These exclusions are for the test jobs added next: the shell
  # executor runs git clean -ffdx before each job, which would otherwise take
  # build/, the installed lib/, and pyexadis*.so with it. Needs concurrent = 1.
  GIT_CLEAN_FLAGS: -ffdx -e build/ -e lib/ -e core/exadis/python/

default:
  tags: [MC3, CPU]
  interruptible: true
  before_script:
    # module purge drops cuda/nvhpc, loaded by default on this node, whose
    # nvc++ fails CMake's compiler check before any SYS setting is read. It
    # also drops cmake and gnu9, both defaults, so load them back.
    - module purge
    - module load gnu9/9.4.0 cmake/3.24.2
    # the conda env the build targets, on PATH rather than via conda activate
    # so this does not depend on where conda.sh lives on the node
    - export PATH=$HOME/.conda/envs/opendis/bin:$PATH
    - which python3 && python3 --version && cmake --version | head -1

build:
  stage: build
  script:
    # the pinned exadis lacks three local fixes; this applies them to the
    # freshly cloned submodule and is a no-op once they land upstream
    - python3 ci/patches/2026-09-20/apply_patches.py
    - rm -rf build; ./configure.sh -DSYS=mc3_cpu_repro
    - cmake --build build -j 8
    - cmake --build build --target install
    # prove the built pieces import, and that the _repro math actually took
    - python3 -c "import sys; sys.path[:0]=['python','lib','core/pydis/python','core/exadis/python']; import pyexadis; from pydis.build_info import build_description; print(build_description())"
  # The two products the test jobs cannot rebuild for themselves. Passing them
  # as artifacts rather than relying on what is left in the working directory
  # keeps a test job retried on its own from running against a workspace whose
  # pyexadis*.so an earlier submodule update deleted. The build tree itself is
  # far too big to ship and stays on disk, so retrying a test job still needs
  # the build job's build/ to be there; ctest says so plainly if it is not.
  artifacts:
    expire_in: 1 week
    paths:
      - core/exadis/python/pyexadis*.so
      - lib/

# Both test jobs consume the build tree the build job left in this same working
# directory, which relies on concurrent = 1 and one runner. What they must not
# do is update the submodules: that step runs git clean inside each submodule,
# where a superproject-relative exclude like core/exadis/python/ does not apply,
# and it deleted the freshly built pyexadis*.so. Hence GIT_SUBMODULE_STRATEGY
# none here, with the module itself arriving from the build job's artifacts.
#
# ctest is parallel here: the tests pin their own thread count, and each case
# has its own working directory under build/tests/*/run/, so they no longer
# share an output/. --test-dir makes ctest chdir into build/, so its
# --output-junit path lands there too, hence build/ on the artifact paths.

unit:
  stage: unit
  needs: [build]
  variables:
    GIT_SUBMODULE_STRATEGY: none
  script:
    - ctest --test-dir build -L unit -j 8 --output-on-failure --output-junit report-unit.xml
  artifacts:
    when: always
    reports:
      junit: build/report-unit.xml

full_run:
  stage: full_run
  needs: [build]
  variables:
    GIT_SUBMODULE_STRATEGY: none
  script:
    - ctest --test-dir build -L full_run -j 4 --output-on-failure --output-junit report-full.xml
  artifacts:
    when: always
    reports:
      junit: build/report-full.xml
    paths:
      - build/tests/full_runs/run/*/output/*.json   # to inspect a divergence
