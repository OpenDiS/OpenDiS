# Conda environment for the OpenDiS Streamlit app in tutorials/streamlit/.
#
# Create it once, from the root of the OpenDiS repository:
#     conda env create -f tutorials/streamlit/environment.yml
# and activate it before you launch the app:
#     conda activate opendis-vis
#
# PyDiS needs only numpy; matplotlib draws PyDiS's own plots, as when a
# tutorial script runs outside the app. Streamlit and Plotly are pinned to the
# versions that the app is written for.
name: opendis-vis
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - numpy
  - matplotlib
  - streamlit=1.61
  - plotly=6.9
  - watchdog  # lets Streamlit see edited files without polling
  - pip
